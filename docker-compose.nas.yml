services:
  cottage:
    image: nginx:1.27-alpine
    container_name: canal-lake-cottage
    ports:
      - "${COTTAGE_PORT:-8097}:80"
    volumes:
      - ./static-site/index.html:/usr/share/nginx/html/index.html:ro
      - ./static-site/privacy.html:/usr/share/nginx/html/privacy.html:ro
      - ./static-site/terms.html:/usr/share/nginx/html/terms.html:ro
      - ./app/globals.css:/usr/share/nginx/html/styles.css:ro
      - ./public/cottage:/usr/share/nginx/html/cottage:ro
      - ./public/nearby:/usr/share/nginx/html/nearby:ro
      - ./public/icons:/usr/share/nginx/html/icons:ro
      - ./public/vendor:/usr/share/nginx/html/vendor:ro
      - ./public/favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./public/og-lakefront-serenity.png:/usr/share/nginx/html/og-lakefront-serenity.png:ro
      - ./static-site/airbnb-availability.json:/usr/share/nginx/html/airbnb-availability.json:ro
      - ./nas/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  airbnb-calendar-sync:
    image: node:22-alpine
    container_name: lakefront-airbnb-calendar-sync
    env_file:
      - ./nas/airbnb-calendar.env
    environment:
      AIRBNB_AVAILABILITY_FILE: /app/static-site/airbnb-availability.json
    volumes:
      - ./scripts/sync-airbnb-calendar.mjs:/app/scripts/sync-airbnb-calendar.mjs:ro
      - ./static-site/airbnb-availability.json:/app/static-site/airbnb-availability.json
    working_dir: /app
    command: ["sh", "-c", "while true; do node /app/scripts/sync-airbnb-calendar.mjs || true; sleep 300; done"]
    restart: unless-stopped
