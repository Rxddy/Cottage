services:
  cottage:
    image: nginx:1.27-alpine
    container_name: canal-lake-cottage
    ports:
      - "${COTTAGE_PORT:-8097}:80"
    volumes:
      - ./static-site/index.html:/usr/share/nginx/html/index.html:ro
      - ./app/globals.css:/usr/share/nginx/html/styles.css:ro
      - ./public/cottage:/usr/share/nginx/html/cottage:ro
      - ./public/favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./public/og.png:/usr/share/nginx/html/og.png:ro
      - ./nas/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

